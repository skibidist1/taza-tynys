<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Таза Тыныс — воздух у школы</title>
  <meta name="description" content="Реальные датчики Алматы и прогноз на 48 часов: физкультура на улице или в зале, когда проветривать и гулять.">
  <meta name="theme-color" content="#eef4f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1a18" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    /* Set the chosen theme before first paint (no flash). No value = follow the device. */
    try { var th = JSON.parse(localStorage.getItem('taza.theme')); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><use href="#logo"></use></svg>
      <div>
        <h1>Таза Тыныс</h1>
        <p class="sub" data-i18n="app_sub"></p>
      </div>
    </div>
    <div class="top-actions">
      <button id="theme" class="ghost theme-btn" type="button" data-mode="auto">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g class="ic ic-auto"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></g>
          <g class="ic ic-light"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>
          <g class="ic ic-dark"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></g>
        </svg>
      </button>
      <button id="lang" class="ghost" type="button"></button>
    </div>
  </header>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today" data-i18n="tab_today" aria-selected="true"></button>
    <button role="tab" data-tab="why" data-i18n="tab_why"></button>
    <button role="tab" data-tab="school" data-i18n="tab_school"></button>
    <button role="tab" data-tab="honest" data-i18n="tab_honest"></button>
  </nav>

  <main>
    <section id="view-today" class="view" data-view="today">
      <div class="hero" id="hero"><p class="loading" data-i18n="loading"></p></div>
      <article class="card" id="place"></article>
      <div class="profiles" id="profiles" role="radiogroup"></div>
      <article class="card" id="actions"></article>
      <article class="card scale-card">
        <div class="card-head"><h2 data-i18n="scale_title"></h2><p class="hint" data-i18n="scale_hint"></p></div>
        <div class="strip-wrap" id="strip-wrap"><div class="strip" id="strip"></div></div>
        <div class="marks"><span class="mk mk-win"></span><span data-i18n="mark_window"></span><span id="mark-actual" hidden><span class="mk mk-act"></span> <span data-i18n="mark_actual"></span></span></div>
        <p class="hour-detail" id="hour-detail"></p>
      </article>
      <article class="card" id="windows"></article>
      <article class="card legend" id="legend"></article>
    </section>

    <section id="view-why" class="view" data-view="why" hidden></section>
    <section id="view-school" class="view" data-view="school" hidden></section>
    <section id="view-honest" class="view" data-view="honest" hidden></section>
  </main>

  <footer class="foot">
    <p data-i18n="install_offline"></p>
    <p>Датчики: AirKaz.org, sensor.community. История: OpenAQ. Погода и CAMS: Open-Meteo (CC BY 4.0), Copernicus. Таза Тыныс — Órleu Hack 2026.</p>
  </footer>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="22" fill="var(--lvl0)"/>
      <path d="M9 21c5-5 10-5 15 0s10 5 15 0" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
      <path d="M9 30c5-5 10-5 15 0s10 5 15 0" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" opacity=".45"/>
    </symbol>
  </svg>

  <script type="module" src="js/app.js"></script>
</body>
</html>
